[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studio-baton"
version = "1.12.0"
description = "Scripted, fail-closed operations toolkit for one-to-one teaching studios: learners, lesson summaries, messaging, video, and calendar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Studio Baton contributors" }]
keywords = ["teaching", "notion", "pipeline", "cli", "agent-skills"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Education",
]

# Kept deliberately small. Everything that talks to a specific vendor lives
# behind an optional extra, so `pip install studio-baton` stays cheap and a
# user only pulls the SDKs for the adapters they actually enable.
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.31",
  "jsonschema>=4.20",
  # Windows ships no system tz database, so `zoneinfo` finds nothing there and
  # every date Baton computes raises. Every other platform already has one.
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Kept so `studio-baton[supabase]` still installs: the Supabase driver is
# PostgrestStore over `requests`, which core already ships.
supabase = []
google = [
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # Pinned to a minor line: the formatter's output changes between ruff
  # minors, and an unpinned formatter turns `ruff format --check` in CI into a
  # job that fails on a day nobody touched the code.
  "ruff>=0.16.3,<0.17",
  "mypy>=1.11",
  "types-PyYAML",
  "types-requests",
]

[project.scripts]
baton = "baton.cli.app:main"

[project.urls]
Homepage = "https://github.com/chunnytechmate/studio-baton"
Issues = "https://github.com/chunnytechmate/studio-baton/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/baton"]

# No `include` here on purpose. A top-level `include` is a whitelist for the
# whole build, not an addition to it: stating one for the data files silently
# excluded every .py file, and the wheel that came out carried the locale
# catalogues and the migrations without a line of code to read them. Listing
# the package under `packages` above already ships everything inside it,
# YAML, JSON, and SQL included.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# `S` (flake8-bandit) is on because Baton interpolates configured identifiers
# into SQL and spawns processes. Those are deliberate and individually
# justified with a noqa; the ruleset makes sure a new one cannot slip in
# unremarked.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
  "RUF001",  # ambiguous unicode in strings: Thai and box-drawing are intentional
  "RUF003",
  "S603",    # subprocess calls are all built from validated argv lists, never a shell string
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",  # assert is the point
  "S105",  # hardcoded "passwords" in tests are fixtures like "t"
  "S106",
  "S607",  # calling `pkill` by name is fine in a test cleanup
]

[tool.mypy]
python_version = "3.10"
files = ["src/baton"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Three modules reuse fixtures via `from tests.test_send import ...`, which
# needs the repository root importable. CI runs `python -m pytest`, and that
# puts it there for free; the `.venv/bin/pytest` in CLAUDE.md does not, so the
# documented command failed collection on exactly those three. Say it here and
# both invocations behave the same.
pythonpath = ["."]
